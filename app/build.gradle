plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// CI stamps each build with its run number, so a newer APK always installs over an older one
// (the in-app updater compares this against latest.json). Local builds stay at 1.
def ciVersionCode = (System.getenv("VERSION_CODE") ?: "1") as Integer
def ciVersionName = System.getenv("VERSION_NAME") ?: "1.0.0-dev"

// The release key is NOT in the repo: CI decodes it from the SIGNING_KEYSTORE_B64 secret.
// Whoever holds this key can ship an update that installs over the app, so it stays private.
def ksPath = System.getenv("SIGNING_KEYSTORE")
def ksPass = System.getenv("SIGNING_PASSWORD")

android {
    namespace 'com.iknalos.twostep'
    compileSdk 34

    defaultConfig {
        applicationId "com.iknalos.twostep"
        minSdk 26
        targetSdk 34
        versionCode ciVersionCode
        versionName ciVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storeType 'pkcs12'
                storePassword ksPass
                keyAlias 'twostep'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // without the key the build is debug-signed, and CI's certificate check refuses to publish it
            signingConfig ksPath ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'

    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    testImplementation 'junit:junit:4.13.2'
    // the real org.json, so codec and backup tests run on the JVM instead of hitting Android stubs
    testImplementation 'org.json:json:20240303'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
}
