name: Build and release

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Unit tests + signed APK
    runs-on: ubuntu-latest
    env:
      # monotonic per run: the in-app updater installs anything with a higher number
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Unit tests (RFC 6238 vectors, GitHub's QR format, backups)
        run: gradle testDebugUnitTest --no-daemon

      - name: Unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 7

      # The key is a secret, not a file in this public repo: whoever holds it can ship an
      # update that installs over TwoStep. The local copy is backed up outside the repo.
      - name: Signing key
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::The SIGNING_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/twostep.p12"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/twostep.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      # Android only installs an update signed with the same key as the installed app, so a
      # wrongly signed release would just fail on the phone. Refuse to publish one at all.
      - name: Check it's signed with the TwoStep key
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          GOT=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          WANT=$(tr -d ' \r\n' < signing-cert.sha256)
          if [ "$GOT" != "$WANT" ]; then echo "::error::APK signed with $GOT, expected $WANT"; exit 1; fi
          cp "$APK" TwoStep.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwoStep-apk
          path: TwoStep.apk
          retention-days: 3       # only hands the APK to the release job; the release keeps it

  device-test:
    name: Emulator tests + update-in-place check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ci/device-test.sh

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          retention-days: 7

      - name: Device test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report
          path: app/build/reports/androidTests/
          retention-days: 7

  release:
    needs: [build, device-test]
    runs-on: ubuntu-latest
    steps:
      - name: Collect the APK
        uses: actions/download-artifact@v4
        with:
          name: TwoStep-apk
          path: dist

      # Installed apps read releases/latest/download/latest.json and offer this build when its
      # number is higher than theirs; sha256 must be of the exact bytes they will download.
      - name: Write latest.json
        env:
          N: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          SHA=$(sha256sum dist/TwoStep.apk | cut -d' ' -f1)
          NOTES=$(printf '%s\n' "$MSG" | head -n1)
          jq -n --argjson build "$N" --arg version "1.0.$N" --arg sha "$SHA" \
            --arg apk "https://github.com/$REPO/releases/download/v1.0.$N/TwoStep.apk" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg notes "$NOTES" \
            '{build: $build, version: $version, apk: $apk, sha256: $sha, date: $date, notes: $notes}' > dist/latest.json
          cat dist/latest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          gh release create "v1.0.$N" dist/TwoStep.apk dist/latest.json -R "$GITHUB_REPOSITORY" --latest \
            --title "TwoStep 1.0.$N" \
            --notes "Install TwoStep.apk on your Android phone (allow installs from your browser once). Installed copies update themselves: TwoStep shows Update available. Built from $GITHUB_SHA."
